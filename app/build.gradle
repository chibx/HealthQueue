plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'nu.studer.jooq' version '10.2.1'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
    implementation 'com.sparkjava:spark-core:2.9.4'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.1'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    implementation 'com.password4j:password4j:1.8.4'
    implementation 'org.hibernate.validator:hibernate-validator:9.1.3.Final'
    implementation 'org.glassfish:jakarta.el:5.0.0-M1'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.20'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    implementation 'org.jooq:jooq:3.21.6'
    runtimeOnly 'org.postgresql:postgresql:42.7.4'
    implementation 'com.github.f4b6a3:uuid-creator:6.1.0'
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
        vendor = JvmVendorSpec.ADOPTIUM
    }
}

application {
    // Define the main class for the application.
    mainClass = 'com.healthqueue.App'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

def secrets = new Properties()
def secretsFile = rootProject.file('secrets.properties')
if (secretsFile.exists()) {
    secrets.load(new FileInputStream(secretsFile))
}

def dbPassword = secrets.getProperty('dbPassword', System.getenv('DB_PASSWORD') ?: '')
def dbUser = secrets.getProperty('dbUser', System.getenv('DB_USER') ?: 'postgres')
def jdbcUrl = secrets.getProperty('jdbcUrl', System.getenv('JDBC_URL') ?: '')

jooq {
    version = '3.21.6'
    edition = nu.studer.gradle.jooq.JooqEdition.OSS

    configurations {
        main {
            generateSchemaSourceOnCompilation = true
            generationTool {
                jdbc {
                    driver = 'org.postgresql.Driver'
                    url = jdbcUrl
                    user = dbUser
                    password = dbPassword
                }
                generator {
                    name = 'org.jooq.codegen.JavaGenerator'
                    database {
                        name = 'org.jooq.meta.postgres.PostgresDatabase'
                        inputSchema = 'public'
                    }
                    generate {
                        records = true
                        pojos = true
                        fluentSetters = true
                    }
                    target {
                        packageName = 'com.healthqueue.db'
                        directory = 'build/generated-src/jooq/main'
                    }
                }
            }
        }
    }
}